<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Furry Pooch — Post C: Wedding season</title>
<link rel="stylesheet" href="brand.css">
<style>
  #post { background: var(--indigo); }
  #post::before { content: ""; position: absolute; right: -200px; top: -260px; width: 700px; height: 700px; border-radius: 50%; background: #7468ec; opacity: .55; }
  #logo { left: 52px; top: 40px; height: 84px; }
  #eyebrow { right: 52px; top: 62px; }
  #h1 { left: 52px; right: 52px; top: 140px; margin: 0; font: 700 84px/1.0 "Fredoka"; letter-spacing: -1px; color: var(--cream); }
  #h1 span { color: var(--yellow); }
  #sub { left: 52px; right: 52px; top: 332px; margin: 0; font: 500 27px/1.35 "Poppins"; color: rgba(255,246,220,.95); }
  .tile { position: absolute; overflow: hidden; border-radius: 26px; box-shadow: 0 14px 30px rgba(20,10,80,.45); background: #fff; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile .code { position: absolute; left: 14px; top: 14px; font: 700 22px/1 "Fredoka"; letter-spacing: 2px; background: var(--yellow); color: var(--brown); border-radius: 999px; padding: 9px 16px 7px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .tile .name { position: absolute; left: 14px; bottom: 14px; font: 700 22px/1 "Fredoka"; background: var(--cream); color: var(--brown); border-radius: 999px; padding: 10px 18px 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  #t1 { left: 52px;  top: 396px; width: 520px; height: 844px; }
  #t2 { left: 588px; top: 396px; width: 440px; height: 414px; }
  #t3 { left: 588px; top: 826px; width: 440px; height: 414px; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: var(--yellow); color: var(--brown); display: flex; align-items: center; justify-content: space-between; padding: 0 52px; }
  #bar .l { font: 700 33px/1 "Fredoka"; }
  #bar .r { font: 600 22px/1 "Poppins"; }
</style></head><body>
<div id="post">
  <img class="abs logo" id="logo" src="assets/logos/furry-pooch-cream.png" alt="Furry Pooch">
  <div class="abs" id="eyebrow"><span class="chip yellow">Wedding season</span></div>
  <h1 class="abs" id="h1">Your pet&rsquo;s<br><span>invited.</span></h1>
  <p class="abs" id="sub">Tuxedo bandanas and bow ties, made for weddings and photo shoots.</p>
  <div class="tile" id="t1"><img src="assets/photos/c-poodle-tux.jpg" alt="Poodle in a black tuxedo bandana"><span class="code">FP25</span><span class="name">Midnight Black</span></div>
  <div class="tile" id="t2"><img src="assets/photos/c-golden-plaid.jpg" alt="Golden retriever in a grey plaid tuxedo bandana"><span class="code">FP27</span><span class="name">Grey Plaid</span></div>
  <div class="tile" id="t3"><img src="assets/photos/c-cat-red-tux.jpg" alt="Cat in a red tuxedo bandana"><span class="code">FP26</span><span class="name">Black &amp; Red</span></div>
  <div id="bar"><span class="l">Save this for wedding season</span><span class="r">DM the code &middot; @furry.pooch</span></div>
</div>
</body></html>
