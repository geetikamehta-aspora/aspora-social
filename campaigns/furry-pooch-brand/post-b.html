<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Furry Pooch — Post B: Cats love fashion too</title>
<link rel="stylesheet" href="brand.css">
<style>
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(46,22,8,.5) 0%, rgba(46,22,8,0) 20%, rgba(46,22,8,0) 50%, rgba(46,22,8,.80) 74%, rgba(46,22,8,.96) 100%); }
  #logo { left: 56px; top: 50px; height: 92px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.45)); }
  #tagtop { right: 56px; top: 66px; }
  #prod { left: 56px; top: 700px; }
  #prod .chip { font-size: 21px; letter-spacing: 1px; text-transform: none; }
  #stack { position: absolute; left: 64px; right: 64px; bottom: 62px; display: flex; flex-direction: column; align-items: flex-start; }
  #h1 { margin: 20px 0 0; font: 700 100px/1.0 "Fredoka"; letter-spacing: -1px; color: var(--cream); text-shadow: 0 4px 24px rgba(0,0,0,.35); }
  #h1 span { color: var(--yellow); }
  #lede { margin: 20px 0 0; font: 500 30px/1.4 "Poppins"; color: rgba(255,246,220,.95); max-width: 900px; }

</style></head><body>
<div id="post">
  <img id="bg" src="assets/photos/b-cat-lace.jpg" alt="Ragdoll cat wearing a sailor plaid lace collar with a gold anchor button">
  <div id="shade"></div>
  <img class="abs logo" id="logo" src="assets/logos/furry-pooch-cream.png" alt="Furry Pooch">
  <div class="abs" id="tagtop"><span class="chip cream">For cat parents</span></div>
  <div class="abs" id="prod"><span class="chip cream">FP17 &middot; Sailor Plaid Lace Collar</span></div>
  <div id="stack">
    <h1 id="h1">Cats love<br><span>fashion too.</span></h1>
    <p id="lede">Lace collars, bow ties, bell collars &amp; harnesses for cats.</p>
    <div id="cta"><span class="chip indigo soft">Tag a cat parent who needs this</span></div>
  </div>
</div>
</body></html>
