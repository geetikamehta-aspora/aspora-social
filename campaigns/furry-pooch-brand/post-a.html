<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Furry Pooch — Post A: The Festive Edit</title>
<link rel="stylesheet" href="brand.css">
<style>
  #post { background: var(--yellow); }
  #photo { position: absolute; left: 0; top: 0; width: 1080px; height: 1050px; object-fit: cover; }
  #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 1050px; background: linear-gradient(180deg, rgba(46,22,8,.5) 0%, rgba(46,22,8,0) 22%); }
  #logo { left: 56px; top: 50px; height: 92px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.45)); }
  #new { right: 48px; top: 64px; }
  #prod { left: 40px; top: 950px; }
  #prod .chip { font-size: 21px; letter-spacing: 1px; text-transform: none; }
  #panel { position: absolute; left: 0; top: 1050px; width: 1080px; height: 300px; background: var(--yellow); padding: 0 56px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 -10px 30px rgba(74,36,16,.25); }
  #h1 { margin: 0; font: 700 82px/1.0 "Fredoka"; color: var(--brown); letter-spacing: -.5px; }
  #lede { margin: 14px 0 0; font: 600 29px/1.3 "Poppins"; color: var(--brown); }
  #row { margin-top: 26px; display: flex; align-items: center; gap: 16px; }
</style></head><body>
<div id="post">
  <img id="photo" src="assets/photos/a-hero-tutu.jpg" alt="Golden retriever in a rainbow tulle dress with a silver satin bandana">
  <div id="shade"></div>
  <img class="abs logo" id="logo" src="assets/logos/furry-pooch-cream.png" alt="Furry Pooch">
  <div class="abs" id="new"><span class="chip yellow">New &middot; Festive Edit</span></div>
  <div class="abs" id="prod"><span class="chip cream">FP12 &middot; Indradhanush Tutu Dress</span></div>
  <div id="panel">
    <h1 id="h1">The Festive Edit is here</h1>
    <p id="lede">Kurta koti, sherwanis, lehenga dresses &amp; more, for dogs and cats.</p>
    <div id="row"><span class="chip indigo soft">DM the code to order</span><span class="chip cream soft" style="border:2px solid var(--brown)">@furry.pooch</span></div>
  </div>
</div>
</body></html>
