<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Furry Pooch — Post 1: Coming to Pets Day Out</title>
<link rel="stylesheet" href="ig.css">
<style>
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(46,22,8,.55) 0%, rgba(46,22,8,0) 20%, rgba(46,22,8,0) 52%, rgba(46,22,8,.80) 74%, rgba(46,22,8,.96) 100%); }
  #logo { left: 56px; top: 50px; height: 92px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.45)); }
  #date { right: 56px; top: 66px; }
  #stack { position: absolute; left: 64px; right: 64px; bottom: 62px; display: flex; flex-direction: column; align-items: flex-start; }
  #h1 { margin: 20px 0 0; font: 700 96px/1.0 "Fredoka"; letter-spacing: -1px; color: var(--cream); text-shadow: 0 4px 24px rgba(0,0,0,.35); }
  #h1 span { color: var(--yellow); }
  #lede { margin: 20px 0 0; font: 500 31px/1.35 "Poppins"; color: rgba(255,246,220,.95); }
  #info { margin-top: 26px; display: flex; align-items: center; gap: 14px; font: 600 25px/1.2 "Poppins"; color: var(--cream); }
  #info .sep { width: 2px; height: 26px; background: rgba(255,246,220,.5); }
  #cta { margin-top: 30px; }
  #cta .chip { font-size: 27px; letter-spacing: 1px; text-transform: none; padding: 17px 32px 15px; }
</style></head><body>
<div id="post">
  <img id="bg" src="assets/hero-cat.jpg" alt="Ragdoll cat wearing the Phool Bagh floral kurta">
  <div id="shade"></div>
  <img class="abs logo" id="logo" src="../assets/logos/furry-pooch-cream.png" alt="Furry Pooch">
  <div class="abs" id="date"><span class="chip cream">24&ndash;25 Oct</span></div>
  <div id="stack">
    <span class="chip yellow">Coming soon</span>
    <h1 id="h1">We&rsquo;re coming to<br><span>Pets Day Out!</span></h1>
    <p id="lede">Get your furry friend ready with all the desi glam.</p>
    <div id="info">
      <svg class="pin" viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.5 12 32 12 32s12-11.5 12-20.3C24 5.2 18.6 0 12 0z" fill="#f5c04a"/><circle cx="12" cy="11.5" r="4.6" fill="#4a2410"/></svg>
      <span>Wings Convention Centre, Kilpauk, Chennai</span>
    </div>
    <div id="cta"><span class="chip indigo">Follow @furry.pooch for first looks</span></div>
  </div>
</div>
</body></html>
