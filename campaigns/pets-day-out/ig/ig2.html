<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Furry Pooch — Post 2: Pick your look</title>
<link rel="stylesheet" href="ig.css">
<style>
  #post { background: var(--yellow); }
  #post::before { content: ""; position: absolute; right: -180px; top: -240px; width: 640px; height: 640px; border-radius: 50%; background: var(--yellow-lt); opacity: .65; }
  #logo { left: 48px; top: 40px; height: 78px; }
  #tag { right: 48px; top: 58px; }
  #h1 { left: 0; right: 0; top: 130px; text-align: center; margin: 0; font: 700 70px/1.05 "Fredoka"; color: var(--brown); letter-spacing: -.5px; }
  #sub { left: 0; right: 0; top: 212px; text-align: center; margin: 0; font: 600 26px/1.3 "Poppins"; color: var(--brown); }
  #grid { position: absolute; left: 48px; top: 268px; width: 984px; display: grid; grid-template-columns: 483px 483px; gap: 18px; }
  .tile { position: relative; width: 483px; height: 470px; border-radius: 28px; overflow: hidden; box-shadow: 0 14px 30px rgba(74,36,16,.28); background: #fff; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile .code { position: absolute; left: 16px; top: 16px; font: 700 24px/1 "Fredoka"; letter-spacing: 2px; background: var(--indigo); color: var(--cream); border-radius: 999px; padding: 10px 18px 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .tile .name { position: absolute; left: 16px; bottom: 16px; font: 700 24px/1 "Fredoka"; background: var(--cream); color: var(--brown); border-radius: 999px; padding: 11px 20px 9px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: var(--indigo); display: flex; align-items: center; justify-content: space-between; padding: 0 48px; }
  #bar .l { font: 700 38px/1 "Fredoka"; color: var(--cream); }
  #bar .l small { display: block; margin-top: 7px; font: 500 20px/1 "Poppins"; color: rgba(255,246,220,.85); }
  #bar .chip { font-size: 25px; letter-spacing: 1px; text-transform: none; }
</style></head><body>
<div id="post">
  <img class="abs logo" id="logo" src="../assets/logos/furry-pooch-brown.png" alt="Furry Pooch">
  <div class="abs" id="tag"><span class="chip indigo">Dogs &amp; cats</span></div>
  <h1 class="abs" id="h1">Pick your pet&rsquo;s festive look</h1>
  <p class="abs" id="sub">Kurtas &middot; Kurta koti &middot; Sherwanis &middot; Lehenga dresses &amp; more</p>
  <div id="grid">
    <div class="tile"><img src="assets/tile-fp03.jpg" alt="Golden retriever in a kurta koti"><span class="code">FP03</span><span class="name">Kurta Koti</span></div>
    <div class="tile"><img src="assets/tile-fp01.jpg" alt="Ragdoll cat in a floral kurta" style="object-position:50% 40%"><span class="code">FP01</span><span class="name">Floral Kurta</span></div>
    <div class="tile"><img src="assets/tile-fp07.jpg" alt="Golden retriever in a sequin sherwani"><span class="code">FP07</span><span class="name">Sherwani</span></div>
    <div class="tile"><img src="assets/tile-fp10.jpg" alt="Golden retriever in a red lehenga dress" style="object-position:50% 30%"><span class="code">FP10</span><span class="name">Lehenga Dress</span></div>
  </div>
  <div id="bar">
    <div class="l">DM us the code to order<small>Example: &ldquo;Hi! I&rsquo;d like FP07&rdquo;</small></div>
    <span class="chip yellow">@furry.pooch</span>
  </div>
</div>
</body></html>
