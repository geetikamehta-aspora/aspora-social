<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Furry Pooch x Pets Day Out — Coming Soon (1080x1350)</title>
<style>
  @font-face { font-family: "Anton";    src: url("assets/fonts/anton.ttf"); }
  @font-face { font-family: "Fredoka";  font-weight: 600; src: url("assets/fonts/fredoka-600.ttf"); }
  @font-face { font-family: "Fredoka";  font-weight: 700; src: url("assets/fonts/fredoka-700.ttf"); }
  @font-face { font-family: "Poppins";  font-weight: 600; src: url("assets/fonts/poppins-600.ttf"); }
  @font-face { font-family: "Poppins";  font-weight: 700; src: url("assets/fonts/poppins-700.ttf"); }
  @font-face { font-family: "Poppins";  font-weight: 800; src: url("assets/fonts/poppins-800.ttf"); }

  :root {
    --ink: #2b1450;
    --purple: #5b34a3;
    --purple-dk: #3a1d78;
    --yellow: #ffc21a;
    --pink: #ff2e88;
    --cream: #fff6dc;
    --brown: #4a2410;
    --orange: #ff8a1f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a0b35; }

  #post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Fredoka", sans-serif; color: var(--cream);
    background:
      radial-gradient(circle at 50% 54%, rgba(255,194,26,.62) 0, rgba(255,194,26,.18) 30%, rgba(255,194,26,0) 50%),
      repeating-conic-gradient(from 0deg at 50% 54%, #512ea0 0 7.5deg, #3d1f80 7.5deg 15deg);
  }
  #post::after { /* vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 40;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(20,6,50,.38) 100%);
  }
  .abs { position: absolute; }
  svg.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }

  /* ---------- logos row ---------- */
  .logo-pill {
    position: absolute; top: 106px; height: 124px; border: 5px solid var(--brown);
    border-radius: 30px; box-shadow: 6px 7px 0 var(--brown);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .logo-pill img { display: block; }
  #fp-pill  { left: 96px;  width: 276px; background: var(--yellow); transform: rotate(-2deg); }
  #fp-pill img { height: 102px; }
  #pdo-pill { right: 96px; width: 220px; background: #14082e; transform: rotate(2deg); }
  #pdo-pill img { height: 104px; }
  #times {
    position: absolute; left: 50%; top: 126px; transform: translateX(-50%); z-index: 10;
    font: 700 64px/1 "Fredoka"; color: var(--yellow);
    text-shadow: 4px 5px 0 var(--brown);
  }

  /* ---------- headline ---------- */
  .sticker {
    position: absolute; z-index: 12; font-family: "Fredoka"; font-weight: 700;
    border: 5px solid var(--brown); box-shadow: 6px 7px 0 var(--brown); border-radius: 999px;
    white-space: nowrap; text-align: center; line-height: 1;
  }
  #soon {
    left: 50%; top: 240px; margin-left: -190px; width: 380px; padding: 14px 0 12px;
    background: var(--pink); color: #fff; font-size: 46px; letter-spacing: 4px;
    transform: rotate(-4deg);
  }
  #heading-to {
    position: absolute; left: 0; right: 0; top: 314px; text-align: center; z-index: 13;
    font: 700 31px/1 "Fredoka"; color: var(--cream); letter-spacing: 1px;
    text-shadow: 3px 4px 0 var(--brown);
  }
  #heading-to b { color: var(--yellow); }
  #title {
    position: absolute; left: 0; right: 0; top: 352px; text-align: center; z-index: 11;
    font: 400 176px/1.05 "Anton"; letter-spacing: 3px; color: var(--yellow);
    text-shadow:
      0 5px 0 #e08a00, 0 10px 0 #b8560b, 0 15px 0 var(--brown),
      0 19px 0 var(--brown), 0 30px 30px rgba(0,0,0,.5);
    transform: rotate(-1.4deg);
  }
  #sub {
    position: absolute; left: 0; right: 0; top: 538px; text-align: center; z-index: 11;
    font: 700 24px/1 "Poppins"; letter-spacing: 5px; color: #fff; text-transform: uppercase;
  }
  #sub span { color: var(--yellow); }

  /* ---------- photo cards ---------- */
  .card {
    position: absolute; z-index: 8; overflow: hidden; background: var(--cream);
    border: 9px solid var(--cream); box-shadow: 10px 12px 0 var(--brown);
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .round { border-radius: 50%; border-color: var(--yellow); }
  .rect  { border-radius: 30px; }
  .arch  { border-radius: 210px 210px 30px 30px; border-color: var(--yellow); }

  /* collage positions */
  #c-left   { left: 40px;  top: 574px; width: 318px; height: 292px; transform: rotate(-6deg); }
  #c-right  { left: 722px; top: 568px; width: 318px; height: 292px; transform: rotate(5deg); }
  #c-arch   { left: 358px; top: 582px; width: 364px; height: 412px; z-index: 9; }
  #c-shades { left: 62px;  top: 806px; width: 208px; height: 208px; z-index: 9; }
  #c-pom    { left: 810px; top: 806px; width: 208px; height: 208px; z-index: 9; }
  #c-tux    { left: 282px; top: 772px; width: 150px; height: 150px; z-index: 11; }
  #c-cat2   { left: 648px; top: 772px; width: 150px; height: 150px; z-index: 11; }

  #woof  { left: 34px;  top: 566px;  background: var(--yellow); color: var(--brown); font-size: 34px; padding: 12px 24px; transform: rotate(-12deg); z-index: 13; }
  #meow  { left: 640px; top: 566px;  background: #fff; color: var(--pink);  font-size: 34px; padding: 12px 24px; transform: rotate(9deg); z-index: 13; }

  /* starburst */
  #burst {
    position: absolute; z-index: 14; left: 408px; top: 962px; width: 264px; height: 150px;
    display: none;
  }

  /* ---------- desi glam banner ---------- */
  #glam {
    position: absolute; z-index: 15; left: -20px; right: -20px; top: 962px; height: 116px;
    background: var(--pink); transform: rotate(-1.6deg);
    border-top: 6px solid var(--brown); border-bottom: 6px solid var(--brown);
    box-shadow: 0 9px 0 var(--brown);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #glam .l1 { font: 700 31px/1 "Fredoka"; color: #fff; letter-spacing: 1px; }
  #glam .l2 { font: 400 70px/1 "Anton"; color: var(--yellow); letter-spacing: 3px; margin-top: 4px;
              text-shadow: 4px 5px 0 var(--brown); }

  /* ---------- date + venue ---------- */
  #date {
    position: absolute; z-index: 12; left: 56px; top: 1086px; height: 150px;
    font: 400 150px/1 "Anton"; color: #fff; letter-spacing: 2px;
    text-shadow: 5px 6px 0 var(--pink), 9px 11px 0 var(--brown);
  }
  #month {
    position: absolute; z-index: 12; left: 62px; top: 1244px;
    font: 700 25px/1 "Poppins"; letter-spacing: 6px; color: var(--yellow);
  }
  #venue {
    position: absolute; z-index: 12; right: 44px; top: 1084px; width: 520px; text-align: left;
  }
  #venue .pin { display: flex; align-items: flex-start; gap: 12px; }
  #venue .name { font: 400 40px/1.02 "Anton"; letter-spacing: 1px; white-space: nowrap; color: var(--yellow); text-transform: uppercase;
                 text-shadow: 3px 4px 0 var(--brown); }
  #venue .area { font: 700 22px/1.2 "Poppins"; color: #fff; margin-top: 4px; letter-spacing: 3px; }
  #venue .see { margin-top: 14px; font: 700 46px/1 "Fredoka"; color: var(--cream); text-shadow: 3px 4px 0 var(--brown); }
  #venue .see b { color: var(--pink); }

  /* ---------- ticker ---------- */
  #ticker {
    position: absolute; z-index: 45; left: 0; right: 0; bottom: 0; height: 56px; background: var(--yellow);
    border-top: 5px solid var(--brown); display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 700 16.5px/1 "Poppins"; letter-spacing: 1.5px; color: var(--brown); text-transform: uppercase; white-space: nowrap;
  }
  #ticker svg { width: 18px; height: 18px; fill: var(--purple); flex: none; }
  #handle {
    display: inline-block; margin-top: 12px; margin-left: 2px;
    font: 700 24px/1 "Poppins"; color: var(--brown); background: var(--yellow);
    border: 4px solid var(--brown); border-radius: 999px; padding: 8px 20px; box-shadow: 4px 5px 0 var(--brown);
  }
</style>
</head>
<body>
<div id="post">

  <!-- background decorations: stars, paws, garland (generated below) -->
  <svg class="layer" id="bgdeco" viewBox="0 0 1080 1350" style="z-index:2"></svg>
  <svg class="layer" id="garland" viewBox="0 0 1080 1350" style="z-index:6"></svg>

  <!-- brand row -->
  <div class="logo-pill" id="fp-pill"><img src="assets/logos/furry-pooch-brown.png" alt="Furry Pooch"></div>
  <div id="times">&times;</div>
  <div class="logo-pill" id="pdo-pill"><img src="assets/logos/pdo-white.png" alt="Pets Day Out"></div>

  <!-- headline -->
  <div class="sticker" id="soon">COMING SOON!</div>
  <div id="heading-to">Furry Pooch is <b>heading to</b></div>
  <div id="title">PETS DAY OUT</div>
  <div id="sub"><span>Star Night Fest</span> &nbsp;&bull;&nbsp; Chennai&rsquo;s biggest pet carnival</div>

  <!-- collage -->
  <div class="card rect"  id="c-left"><img src="assets/photos/golden-rangeela-kurta.jpg" alt="Golden retriever in a Rangeela kurta set"></div>
  <div class="card rect"  id="c-right"><img src="assets/photos/golden-purple-lehenga.jpg" alt="Golden retriever in a festive lehenga frock"></div>
  <div class="card arch"  id="c-arch"><img src="assets/photos/cat-floral-kurta.jpg" style="object-position:50% 40%" alt="Ragdoll cat in a Phool Bagh floral kurta"></div>
  <div class="card round" id="c-shades"><img src="assets/photos/golden-shades.jpg" alt="Golden retriever in retro sunglasses"></div>
  <div class="card round" id="c-pom"><img src="assets/photos/pom-pink-sherwani.jpg" alt="Pomeranian in a Gulaal sequin sherwani"></div>
  <div class="card round" id="c-tux"><img src="assets/photos/poodle-tuxedo.jpg" style="object-position:50% 25%" alt="Poodle in a tuxedo"></div>
  <div class="card round" id="c-cat2"><img src="assets/photos/cat-pink-brocade.jpg" alt="Cat in a pink brocade kurta"></div>
  <div class="sticker" id="woof">Woof!</div>
  <div class="sticker" id="meow">Meow!</div>

  <!-- desi glam banner -->
  <div id="glam">
    <div class="l1">Get your furry friend ready with</div>
    <div class="l2">ALL THE DESI GLAM!</div>
  </div>

  <!-- date + venue -->
  <div id="date">24&ndash;25</div>
  <div id="month">OCTOBER 2026</div>
  <div id="venue">
    <div class="pin">
      <svg width="34" height="44" viewBox="0 0 24 32" style="flex:none;margin-top:2px"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.5 12 32 12 32s12-11.5 12-20.3C24 5.2 18.6 0 12 0z" fill="#ff2e88" stroke="#4a2410" stroke-width="2"/><circle cx="12" cy="11.5" r="4.6" fill="#fff6dc"/></svg>
      <div>
        <div class="name">Wings Convention Centre</div>
        <div class="area">KILPAUK, CHENNAI</div>
      </div>
    </div>
    <div class="see">See you all there<b>!</b></div>
    <div id="handle">@furry.pooch</div>
  </div>

  <!-- ticker -->
  <div id="ticker"></div>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  /* paw print (viewBox 0 0 100 100) */
  const pawPath = (g, fill, opacity = 1) => {
    el("ellipse", { cx: 50, cy: 66, rx: 24, ry: 20, fill, opacity }, g);
    [[20, 40, -25], [40, 22, -8], [62, 22, 8], [82, 40, 25]].forEach(([x, y, r]) =>
      el("ellipse", { cx: x, cy: y, rx: 10, ry: 14, fill, opacity, transform: `rotate(${r} ${x} ${y})` }, g));
  };

  /* ---- background: sparkles + paws ---- */
  const bg = document.getElementById("bgdeco");
  const spark = (x, y, s, fill, rot = 0, op = 1) => {
    const g = el("g", { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})`, opacity: op }, bg);
    el("path", { d: "M0-30 C3-8 8-3 30 0 C8 3 3 8 0 30 C-3 8 -8 3 -30 0 C-8-3 -3-8 0-30Z", fill }, g);
  };
  [[96, 262, .7, "#fff"], [986, 268, .9, "#ffc21a"], [840, 330, .5, "#fff"], [196, 340, .55, "#ffc21a"],
   [1030, 560, .6, "#fff"], [38, 540, .55, "#fff"], [1036, 1196, .7, "#ffc21a"], [30, 1078, .5, "#fff"],
   [520, 1112, .45, "#fff"], [1040, 380, .45, "#ffc21a"]]
    .forEach(([x, y, s, f], i) => spark(x, y, s, f, i * 9, .95));
  [[160, 592, 54, -20], [930, 582, 58, 18], [24, 1000, 50, -10], [1008, 1004, 54, 14], [560, 1050, 40, 8]]
    .forEach(([x, y, s, r]) => {
      const g = el("g", { transform: `translate(${x} ${y}) rotate(${r}) scale(${s / 100})` }, bg);
      pawPath(g, "#ffc21a", .5);
    });

  /* ---- confetti ---- */
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = ["#ff2e88", "#ffc21a", "#ffffff", "#ff8a1f", "#7ee0ff"];
  for (let i = 0; i < 46; i++) {
    const x = rnd() * 1080; let y = 120 + rnd() * 1040;
    if (y > 515 && y < 575) y += 70;
    const w = 8 + rnd() * 10, h = 14 + rnd() * 14, f = cols[i % cols.length];
    if (rnd() < .45) el("circle", { cx: x, cy: y, r: 4 + rnd() * 5, fill: f, opacity: .9 }, bg);
    else el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: f, opacity: .9, transform: `translate(${x} ${y}) rotate(${rnd() * 180})` }, bg);
  }

  /* ---- marigold garland (toran) ---- */
  const gl = document.getElementById("garland");
  const marigold = (cx, cy, r, a, b) => {
    const g = el("g", { transform: `translate(${cx} ${cy})` }, gl);
    for (let i = 0; i < 12; i++)
      el("ellipse", { cx: 0, cy: -r * .62, rx: r * .3, ry: r * .46, fill: a, stroke: "#b8560b", "stroke-width": 1, transform: `rotate(${i * 30})` }, g);
    for (let i = 0; i < 9; i++)
      el("ellipse", { cx: 0, cy: -r * .36, rx: r * .24, ry: r * .34, fill: b, transform: `rotate(${i * 40 + 10})` }, g);
    el("circle", { r: r * .2, fill: "#c4570a" }, g);
  };
  const leaf = (x, y, rot) => el("path", { d: "M0 0C10-14 22-14 28 0C22 14 10 14 0 0Z", fill: "#2f9e4f", transform: `translate(${x} ${y}) rotate(${rot})` }, gl);
  const bell = (x, y) => {
    const g = el("g", { transform: `translate(${x} ${y})` }, gl);
    el("path", { d: "M-11 0 C-11 -14 11 -14 11 0 L14 10 L-14 10Z", fill: "#ffc21a", stroke: "#4a2410", "stroke-width": 2.5 }, g);
    el("circle", { cx: 0, cy: 13, r: 4, fill: "#4a2410" }, g);
  };
  const quad = (p0, p1, p2, t) => [
    (1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0],
    (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];
  const swag = (x0, x1, n) => {
    const p0 = [x0, -8], p2 = [x1, -8], p1 = [(x0 + x1) / 2, 118];
    el("path", { d: `M${p0} Q${p1} ${p2}`, fill: "none", stroke: "#6a3b12", "stroke-width": 4 }, gl);
    for (let i = 0; i <= n; i++) {
      const [x, y] = quad(p0, p1, p2, i / n);
      if (i % 2) leaf(x - 6, y + 12, 70 + (i % 4) * 20);
    }
    for (let i = 0; i <= n; i++) {
      const [x, y] = quad(p0, p1, p2, i / n);
      marigold(x, y, 25, i % 2 ? "#ffb300" : "#ff8a1f", i % 2 ? "#ffd24a" : "#ffb300");
    }
  };
  swag(-40, 540, 10);
  swag(540, 1120, 10);
  /* hanging strands */
  const strand = (x, len, n) => {
    el("line", { x1: x, y1: 20, x2: x, y2: 20 + len, stroke: "#6a3b12", "stroke-width": 3.5 }, gl);
    for (let i = 0; i < n; i++) marigold(x, 34 + i * (len / n), 20, i % 2 ? "#ffb300" : "#ff8a1f", i % 2 ? "#ffd24a" : "#ffb300");
    bell(x, 20 + len + 8);
  };
  strand(28, 120, 4);
  strand(1052, 120, 4);
  strand(540, 74, 3);

  /* ---- ticker ---- */
  const items = ["Live music", "Fire show", "Pet show", "Adoption corner", "25+ food stalls", "Shopping"];
  const tk = document.getElementById("ticker");
  items.forEach((t, i) => {
    if (i) {
      const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 100 100");
      const g = el("g", {}, s); pawPath(g, "currentColor"); tk.appendChild(s);
    }
    const sp = document.createElement("span"); sp.textContent = t; tk.appendChild(sp);
  });
</script>
</body>
</html>
