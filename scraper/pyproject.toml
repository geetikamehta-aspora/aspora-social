[project]
name = "aspora-scraper"
version = "0.1.0"
description = "Aspora Leadership Dashboard: YouTube ingestion + manual-upload parsing pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "supabase>=2.5",
  "httpx>=0.27",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "openai>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aspora_scraper*"]
