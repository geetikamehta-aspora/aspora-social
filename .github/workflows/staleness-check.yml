name: Staleness check

# Separate from process-uploads.yml's 15-min poll deliberately — this only
# needs to run once a day, otherwise a stale account would trigger a Slack
# nudge every 15 minutes instead of once.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -e .

      - name: Check for stale accounts
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m aspora_scraper.ingest.check_staleness
